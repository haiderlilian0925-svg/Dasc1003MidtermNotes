<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midterm Study Flashcards</title>
    <style>
        body {
            background-color: #131314;
            color: #e3e3e3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #e3e3e3;
            margin-bottom: 5px;
            text-align: center;
        }

        .instructions {
            margin-bottom: 30px;
            color: #c4c7c5;
            font-size: 1.1rem;
        }

        .flashcard-container {
            width: 700px;
            height: 400px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s ease-in-out;
            transform-style: preserve-3d;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
            border-radius: 20px;
            border: 1px solid #444746;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            font-size: 1.6rem;
            line-height: 1.5;
        }

        .card-front {
            background-color: #1e1f20;
            color: #e3e3e3;
        }

        .card-front::before {
            content: "QUESTION";
            font-size: 0.9rem;
            color: #9aa0a6;
            letter-spacing: 2px;
            position: absolute;
            top: 20px;
        }

        .card-back {
            background-color: #282a2c;
            color: #a8c7fa;
            transform: rotateY(180deg);
            font-size: 1.4rem;
        }

        .card-back::before {
            content: "ANSWER";
            font-size: 0.9rem;
            color: #9aa0a6;
            letter-spacing: 2px;
            position: absolute;
            top: 20px;
        }

        .controls {
            margin-top: 40px;
            display: flex; 
            gap: 20px;
        }

        button {
            background-color: #0b57d0;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }

        button:hover {
            background-color: #0842a0;
        }

        .progress {
            margin-top: 15px;
            color: #c4c7c5;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <h1>Course Review Flashcards</h1>
    <div class="instructions" id="instructions">Click the flashcard to reveal the answer.</div>

    <div class="flashcard-container" id="flashcard-container">
        <div class="flashcard" id="flashcard">
            <div class="card-face card-front">
                <span id="front-text"></span>
            </div>
            <div class="card-face card-back">
                <span id="back-text"></span>
            </div>
        </div>
    </div>

    <div class="controls" id="controls">
        <button id="prev-btn">Backwards</button>
        <button id="next-btn">Forwards</button>
    </div>
    
    <div class="progress" id="progress-text"></div>

        let currentIndex = 0;

        const frontTextEl = document.getElementById('front-text');
        const backTextEl = document.getElementById('back-text');
        const flashcardEl = document.getElementById('flashcard');
        const progressEl = document.getElementById('progress-text');

        function loadCard(index) {
            frontTextEl.textContent = flashcardsData[index].question;
            backTextEl.textContent = flashcardsData[index].answer;
            progressEl.textContent = `Card ${index + 1} of ${flashcardsData.length}`;
            
            if (flashcardEl.classList.contains('flipped')) {
                flashcardEl.classList.remove('flipped');
            }
        }

        // Initialize first card
        loadCard(currentIndex);

        document.getElementById('flashcard-container').addEventListener('click', function() {
            flashcardEl.classList.toggle('flipped');
        });

        document.getElementById('next-btn').addEventListener('click', function() {
            currentIndex = (currentIndex + 1) % flashcardsData.length;
            if(flashcardEl.classList.contains('flipped')) {
                flashcardEl.classList.remove('flipped');
                setTimeout(() => loadCard(currentIndex), 300);
            } else {
                loadCard(currentIndex);
            }
        });

        document.getElementById('prev-btn').addEventListener('click', function() {
            currentIndex = (currentIndex - 1 + flashcardsData.length) % flashcardsData.length;
            if(flashcardEl.classList.contains('flipped')) {
                flashcardEl.classList.remove('flipped');
                setTimeout(() => loadCard(currentIndex), 300);
            } else {

</body>
</html>
